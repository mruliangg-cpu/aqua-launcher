# Render.com: сайт Aqua Launcher (статический, бесплатный). Render → New → Blueprint → этот репозиторий.
services:
  - type: web
    name: aqua-launcher-site
    runtime: static
    buildCommand: echo "static site"
    staticPublishPath: ./website
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
