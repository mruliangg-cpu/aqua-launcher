name: Probe 26.x availability

on:
  push:
    branches: [ main ]

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe26]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Fabric/Mojang for 26.x
        run: python3 tools/mc/probe26.py
      - name: Build name bridge for 26.3
        run: |
          python3 tools/mc/bridge_mappings.py 26.3 1.21.11 /tmp/26.3-bridge.tiny || echo "BRIDGE FAILED"
          echo "--- head of bridge ---"; head -20 /tmp/26.3-bridge.tiny || true
          echo "--- lines ---"; wc -l /tmp/26.3-bridge.tiny || true
          echo "--- sample known classes (MinecraftClient / ClientPlayerEntity) ---"
          grep -aE "class_310|class_746" /tmp/26.3-bridge.tiny | head -4 || true
