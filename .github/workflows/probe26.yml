name: Probe 26.x availability

on:
  push:
    branches: [ main ]

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe26]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Fabric/Mojang for 26.x
        run: python3 tools/mc/probe26.py
      - name: Build Yarn<->Mojang bridge from 1.21.11
        run: |
          python3 tools/mc/bridge_mappings.py 1.21.11 /tmp/bridge.tiny || echo "BRIDGE FAILED"
          echo "--- lines ---"; wc -l /tmp/bridge.tiny || true
          echo "--- Minecraft / Player class lines (official Mojang -> yarn) ---"
          grep -aE "client/Minecraft\b|client/player/LocalPlayer|MinecraftClient" /tmp/bridge.tiny | head -6 || true
          echo "--- a few method lines ---"; grep -aE "^\tm" /tmp/bridge.tiny | head -5 || true
