# Облачная сборка Aqua: мод Aqua Client (jar) + Aqua Launcher (установщик и portable).
# Каждый push в main: если версия в launcher/package.json новая — публикуется релиз, и все лаунчеры обновятся сами.
name: Build Aqua Launcher
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Build Aqua Client
        working-directory: aqua-client
        run: chmod +x gradlew && ./gradlew build -x copyToLauncher --no-daemon --stacktrace
      - name: Collect jar
        run: mkdir -p out && cp aqua-client/build/libs/aqua-client-*.jar out/ && ls -la out && mv "$(ls out/*.jar | grep -v sources | head -1)" out/aqua-client-1.21.1.jar.keep && rm -f out/*.jar && mv out/aqua-client-1.21.1.jar.keep out/aqua-client-1.21.1.jar
      - uses: actions/upload-artifact@v4
        with: { name: aqua-client, path: out/aqua-client-1.21.1.jar }

  launcher:
    needs: client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: launcher/package-lock.json }
      - uses: actions/download-artifact@v4
        with: { name: aqua-client, path: launcher/resources }
      - name: Install
        working-directory: launcher
        run: npm ci
      - name: Is this a new version?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./launcher/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "publish=false" >> "$GITHUB_OUTPUT"; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi
      - name: Build (check)
        if: ${{ steps.ver.outputs.publish != 'true' }}
        working-directory: launcher
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Build and publish release v${{ steps.ver.outputs.version }}
        if: ${{ steps.ver.outputs.publish == 'true' }}
        working-directory: launcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --x64 --publish always
      - uses: actions/upload-artifact@v4
        with:
          name: AquaLauncher-Windows
          path: launcher/dist/*.exe
