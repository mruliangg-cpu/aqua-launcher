# Облачная сборка Aqua: мод Aqua Client (jar) + Aqua Launcher (установщик и portable).
# Каждый push в main: если версия в launcher/package.json новая — публикуется релиз, и все лаунчеры обновятся сами.
name: Build Aqua Launcher
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.v.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          ONLY=$(echo "$MSG" | grep -oE '\[only:[^]]+\]' | head -1 | sed -E 's/\[only:([^]]+)\]/\1/')
          if [ -n "$ONLY" ]; then echo "list=$(python3 -c "import json,sys; print(json.dumps(sys.argv[1].split(',')))" "$ONLY")" >> "$GITHUB_OUTPUT"
          else echo "list=$(python3 tools/mc/resolve.py matrix)" >> "$GITHUB_OUTPUT"; fi

  client:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        mc: ${{ fromJson(needs.versions.outputs.list) }}
    name: client ${{ matrix.mc }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: |
          if [[ "${{ matrix.mc }}" == 26* ]]; then echo "java=25" >> "$GITHUB_OUTPUT"; else echo "java=21" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '${{ steps.cfg.outputs.java }}' }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.mc }}-${{ hashFiles('aqua-client/build.gradle', 'aqua-client/gradle/wrapper/*') }}
          restore-keys: gradle-${{ matrix.mc }}-
      - name: Prepare sources for ${{ matrix.mc }}
        run: python3 tools/mc/preprocess.py aqua-client build-${{ matrix.mc }} ${{ matrix.mc }}
      - name: Build name bridge (26.x only)
        if: startsWith(matrix.mc, '26')
        run: python3 tools/mc/bridge_mappings.py 1.21.11 build-${{ matrix.mc }}/aqua-bridge.tiny
      - name: Use Gradle 9 for 26.x (Java 25)
        if: startsWith(matrix.mc, '26')
        run: |
          sed -i -E 's|gradle-[0-9.]+-bin.zip|gradle-9.1.0-bin.zip|' build-${{ matrix.mc }}/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl build-${{ matrix.mc }}/gradle/wrapper/gradle-wrapper.properties
      - name: Build Aqua Client ${{ matrix.mc }}
        working-directory: build-${{ matrix.mc }}
        run: |
          ARGS=$(python3 ../tools/mc/resolve.py ${{ matrix.mc }})
          echo "$ARGS"
          chmod +x gradlew && ./gradlew build -x copyToLauncher --no-daemon $ARGS
      - name: Collect jar
        run: |
          mkdir -p out
          J=$(ls build-${{ matrix.mc }}/build/libs/*.jar | grep -v sources | head -1)
          cp "$J" out/aqua-client-${{ matrix.mc }}.jar
      - uses: actions/upload-artifact@v4
        with:
          name: aqua-client-${{ matrix.mc }}
          path: out/aqua-client-${{ matrix.mc }}.jar

  launcher:
    needs: client
    if: ${{ !cancelled() && !contains(github.event.head_commit.message, '[only:') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: launcher/package-lock.json }
      - uses: actions/download-artifact@v4
        with:
          pattern: aqua-client-*
          path: launcher/resources/clients
          merge-multiple: true
      - name: Install
        working-directory: launcher
        run: npm ci
      - name: Is this a new version?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./launcher/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          R="--repo $GITHUB_REPOSITORY"
          if gh release view "v$V" $R >/dev/null 2>&1; then
            if [ "$(gh release view "v$V" $R --json isDraft -q .isDraft)" = "false" ] && gh release view "v$V" $R --json assets -q '.assets[].name' | grep -qx latest.yml; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "Release v$V is incomplete — recreating"; gh release delete "v$V" $R --yes --cleanup-tag; echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build (check)
        if: ${{ steps.ver.outputs.publish != 'true' }}
        working-directory: launcher
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Prepare draft release v${{ steps.ver.outputs.version }}
        if: ${{ steps.ver.outputs.publish == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.ver.outputs.version }}
          gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "v$V" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Aqua Launcher $V" \
              --notes "Install **AquaLauncher-Setup-$V.exe** once — after that the launcher updates itself. Portable version: AquaLauncher-Portable-$V.exe."
      - name: Build and upload
        if: ${{ steps.ver.outputs.publish == 'true' }}
        working-directory: launcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --x64 --publish always
      - name: Attach Aqua Client mod jars (Fabric)
        if: ${{ steps.ver.outputs.publish == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p mods-out
          for f in launcher/resources/clients/aqua-client-*.jar; do
            [ -f "$f" ] || continue
            mc=$(basename "$f" .jar); mc=${mc#aqua-client-}
            cp "$f" "mods-out/AquaClient-$mc-fabric.jar"
          done
          ls mods-out
          if ls mods-out/*.jar >/dev/null 2>&1; then gh release upload "v${{ steps.ver.outputs.version }}" mods-out/*.jar --repo "$GITHUB_REPOSITORY" --clobber; fi
      - name: Publish release
        if: ${{ steps.ver.outputs.publish == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ steps.ver.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - uses: actions/upload-artifact@v4
        with:
          name: AquaLauncher-Windows
          path: launcher/dist/*.exe
