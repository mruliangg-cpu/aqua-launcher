plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (project.hasProperty('use_bridge')) {
        // 26.x: игра без обфускации, Yarn нет — свой мост имён (official Mojang -> Yarn-имена 1.21.11).
        mappings loom.layered {
            mappings(rootProject.file('aqua-bridge.tiny'))
        }
    } else {
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

def javaVersion = (project.findProperty('java_version') ?: '21') as int

processResources {
    def p = [version: project.version, minecraft_version: project.minecraft_version, java_version: javaVersion]
    inputs.properties p
    filesMatching(["fabric.mod.json", "aquaclient.mixins.json"]) { expand p }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
    it.options.encoding = 'UTF-8'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(javaVersion) }
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

// Копируем готовый jar прямо в лаунчер
tasks.register('copyToLauncher', Copy) {
    dependsOn remapJar
    from(remapJar.archiveFile)
    into(file('../launcher/resources'))
    rename { "aqua-client-${project.minecraft_version}.jar" }
}
build.finalizedBy copyToLauncher
